[package]
name = "scrcpy-hub"
version = "0.1.0"
description = "Scrcpy Hub - Desktop Companion & App Launcher"
authors = ["Isnanto Budi Nurrahman"]
edition = "2024"

[lib]
name = "scrcpy_hub_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
